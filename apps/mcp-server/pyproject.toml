[project]
name = "mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2.0",
    "fastmcp>=0.4.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pytriz @ git+https://github.com/mmysior/pytriz.git",
    "starlette>=0.35.0",
    "uvicorn>=0.25.0",
    "google-antigravity",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true
